<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4faf9"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#10121d" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="40" r="320" fill="#0f766e" opacity="0.05"/>
  <circle cx="1120" cy="120" r="180" fill="#0f766e" opacity="0.05"/>
  <rect width="1200" height="8" fill="url(#top)"/>
  <text x="80" y="92" font-size="29" font-weight="700" fill="#16181d" letter-spacing="-0.3">side<tspan fill="#0f766e">·</tspan>str</text>
  <text x="1120" y="90" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="2">USER ACTIVATED SIDECHAINS</text>
  <text x="78" y="258" font-size="50" font-weight="800" fill="#16181d" letter-spacing="-1.6">Signers order blocks.</text>
  <text x="78" y="322" font-size="44" font-style="italic" font-weight="600" fill="#37414d" letter-spacing="-0.6">Users enforce the <tspan fill="#0f766e" font-weight="700">rules</tspan>.</text>
  <text x="80" y="392" font-size="22" fill="#5b6470">Bitcoin's rules beside a Bitcoin chain. Blocks valid because signed.</text>
  <text x="80" y="422" font-size="22" fill="#5b6470">No subsidy. Every coin a coin locked on the parent, with a refund path.</text>
  <g>
    <text x="80" y="540" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#1a7f37">0</text>
    <text x="80" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">SUBSIDY</text>
    <text x="230" y="540" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#16181d">1</text>
    <text x="230" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">RULE ADDED</text>
    <text x="440" y="540" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#16181d">6</text>
    <text x="440" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">CHAINS</text>
    <text x="590" y="540" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" fill="#0f766e">sidestr.com</text>
    <text x="590" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">VALIDATED IN A TAB</text>
  </g>
  <g filter="url(#soft)"><rect x="852" y="150" width="288" height="330" rx="18" fill="#ffffff" stroke="#e6e8eb" stroke-width="1.5"/></g>
  <text x="884" y="194" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="2.5">A SIDING</text>
  <line x1="884" y1="210" x2="1108" y2="210" stroke="#eef0f2" stroke-width="1.5"/>
  <g font-size="19" fill="#16181d">
    <text x="912" y="248">A document and a key</text><text x="912" y="288">Genesis from the pegs</text><text x="912" y="328">Signed, not mined</text><text x="912" y="368">Rules you adopt</text><text x="912" y="408">Refund without asking</text><text x="912" y="448">Sidings of sidings</text>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700" fill="#1a7f37">
    <text x="884" y="248">✓</text><text x="884" y="288">✓</text><text x="884" y="328">✓</text><text x="884" y="368">✓</text><text x="884" y="408">✓</text><text x="884" y="448">✓</text>
  </g>
